<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>掌柜智库 - 文件导入</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --brand:#4f6ef7;--brand2:#7c5cfc;
      --bg:#f5f7fa;--card:#fff;--text:#1a1a2e;--muted:#8b8fa3;
      --border:#e8eaef;--success:#22c55e;--error:#ef4444;--warning:#f59e0b;
      --radius:12px;
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;
    }

    /* 顶栏 */
    .topbar{
      position:sticky;top:0;z-index:50;height:56px;
      display:flex;align-items:center;gap:12px;padding:0 24px;
      background:#fff;border-bottom:1px solid var(--border);
    }
    .topbar .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center}
    .topbar .logo svg{width:18px;height:18px;fill:#fff}
    .topbar h2{font-size:15px;font-weight:600}
    .topbar .sub{font-size:12px;color:var(--muted)}
    .topbar .spacer{flex:1}
    .topbar .actions{display:flex;gap:8px;align-items:center}
    .top-btn{
      padding:6px 14px;border:1px solid var(--border);border-radius:8px;
      background:#fff;font-size:13px;cursor:pointer;color:var(--text);transition:all .2s;
    }
    .top-btn:hover{border-color:var(--brand);color:var(--brand)}
    .user-tag{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:#f5f6f8;font-size:13px}
    .user-tag .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}

    .container{max-width:860px;margin:0 auto;padding:24px 20px}

    /* 上传区域 */
    .upload-area{
      border:2px dashed var(--border);border-radius:16px;padding:48px 24px;
      text-align:center;cursor:pointer;transition:all .25s;background:#fff;
      margin-bottom:24px;
    }
    .upload-area:hover,.upload-area.dragover{
      border-color:var(--brand);background:rgba(79,110,247,.03);
    }
    .upload-icon{
      width:64px;height:64px;border-radius:16px;
      background:linear-gradient(135deg,rgba(79,110,247,.1),rgba(124,92,252,.1));
      display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;
    }
    .upload-icon svg{width:32px;height:32px;fill:var(--brand)}
    .upload-area h3{font-size:16px;font-weight:600;margin-bottom:6px}
    .upload-area p{font-size:13px;color:var(--muted);margin-bottom:16px}

    .format-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
    .format-tag{
      display:inline-flex;align-items:center;gap:4px;
      padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;
      border:1px solid var(--border);background:#fff;color:var(--muted);
    }
    .format-tag .ft-icon{font-size:14px}

    .file-input{display:none}
    .upload-btn{
      display:inline-flex;align-items:center;gap:6px;
      padding:10px 28px;border:none;border-radius:10px;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .2s;
    }
    .upload-btn:hover{opacity:.9}

    /* 批量操作栏 */
    .batch-bar{
      display:none;align-items:center;justify-content:space-between;
      padding:14px 20px;background:#fff;border-radius:var(--radius);
      border:1px solid var(--border);margin-bottom:16px;
    }
    .batch-bar.show{display:flex}
    .batch-info{font-size:14px;color:var(--text)}
    .batch-info strong{color:var(--brand)}
    .batch-btns{display:flex;gap:8px}
    .batch-btn{
      padding:8px 20px;border:none;border-radius:8px;font-size:13px;
      font-weight:500;cursor:pointer;transition:opacity .2s;
    }
    .batch-btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
    .batch-btn.secondary{background:#f5f6f8;color:var(--text)}
    .batch-btn:hover{opacity:.9}

    /* 任务列表 */
    .task-list{display:flex;flex-direction:column;gap:12px}
    .task-card{
      background:#fff;border-radius:var(--radius);border:1px solid var(--border);
      padding:18px 20px;transition:box-shadow .2s;
    }
    .task-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.05)}
    .task-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .task-icon{
      width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
      font-size:20px;flex-shrink:0;
    }
    .task-icon.pdf{background:#fee2e2}
    .task-icon.md{background:#d1fae5}
    .task-icon.docx{background:#dbeafe}
    .task-icon.pptx{background:#fef3c7}
    .task-icon.txt{background:#f3f4f6}
    .task-icon.img{background:#ede9fe}
    .task-info{flex:1;min-width:0}
    .task-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .task-meta{font-size:12px;color:var(--muted);margin-top:2px}
    .task-status{
      padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;
      color:#fff;flex-shrink:0;
    }
    .task-status.uploading{background:var(--warning)}
    .task-status.processing{background:var(--brand)}
    .task-status.completed{background:var(--success)}
    .task-status.failed{background:var(--error)}
    .task-status.skipped{background:#94a3b8}

    /* 进度条 */
    .progress-wrap{margin-bottom:10px}
    .progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    .progress-label{font-size:12px;color:var(--muted)}
    .progress-pct{font-size:13px;font-weight:700}
    .progress-bar-bg{
      width:100%;height:8px;background:#f0f1f3;border-radius:4px;overflow:hidden;
    }
    .progress-bar-fill{
      height:100%;border-radius:4px;transition:width .4s ease,background .4s;
      min-width:0;
    }

    /* 日志 */
    .log-toggle{
      display:flex;align-items:center;gap:6px;
      font-size:12px;color:var(--muted);cursor:pointer;user-select:none;
      margin-top:8px;padding:6px 0;
    }
    .log-toggle:hover{color:var(--text)}
    .log-toggle .arrow{transition:transform .2s;display:inline-block}
    .log-toggle.open .arrow{transform:rotate(90deg)}
    .log-list{
      margin-top:6px;padding-left:20px;display:none;
      max-height:200px;overflow-y:auto;
    }
    .log-list.open{display:block}
    .log-list li{font-size:12px;color:#56657a;margin:3px 0;line-height:1.4}
    .log-list li.done{color:var(--success)}
    .log-list li.running{color:var(--brand)}
    .log-list li.failed{color:var(--error)}

    /* 汇总 */
    .summary-card{
      display:none;background:#fff;border-radius:var(--radius);border:1px solid var(--border);
      padding:24px;text-align:center;margin-top:20px;
    }
    .summary-card.show{display:block}
    .summary-card h3{font-size:16px;font-weight:700;margin-bottom:16px}
    .summary-stats{display:flex;justify-content:center;gap:32px;margin-bottom:20px}
    .summary-stat{text-align:center}
    .summary-stat .num{font-size:28px;font-weight:700}
    .summary-stat .num.green{color:var(--success)}
    .summary-stat .num.red{color:var(--error)}
    .summary-stat .num.gray{color:#94a3b8}
    .summary-stat .label{font-size:12px;color:var(--muted);margin-top:2px}
    .summary-btns{display:flex;gap:10px;justify-content:center}

    .empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}

    @media(max-width:600px){
      .container{padding:16px 12px}
      .upload-area{padding:32px 16px}
      .batch-bar{flex-direction:column;gap:12px}
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>
    <h2>知识库文件导入</h2>
    <span class="sub">支持多格式批量上传</span>
    <div class="spacer"></div>
    <div class="actions">
      <button class="top-btn" onclick="goChat()">查询页面</button>
      <div class="user-tag"><span class="dot"></span><span id="userName">用户</span></div>
    </div>
  </div>

  <div class="container">
    <!-- 上传区域 -->
    <div class="upload-area" id="dropZone">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      </div>
      <h3>点击或拖拽文件到此处</h3>
      <p>支持批量上传，每个文件独立处理</p>
      <div class="format-tags">
        <span class="format-tag"><span class="ft-icon">📕</span> PDF</span>
        <span class="format-tag"><span class="ft-icon">📗</span> Markdown</span>
        <span class="format-tag"><span class="ft-icon">📘</span> Word</span>
        <span class="format-tag"><span class="ft-icon">📙</span> PPT</span>
        <span class="format-tag"><span class="ft-icon">📄</span> TXT</span>
        <span class="format-tag"><span class="ft-icon">🖼️</span> JPG/PNG</span>
      </div>
      <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
        选择文件
      </button>
      <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md,.docx,.pptx,.txt,.jpg,.jpeg,.png" />
    </div>

    <!-- 批量操作栏 -->
    <div class="batch-bar" id="batchBar">
      <div class="batch-info">已选择 <strong id="fileCount">0</strong> 个文件</div>
      <div class="batch-btns">
        <button class="batch-btn secondary" onclick="clearPending()">清空列表</button>
        <button class="batch-btn primary" onclick="uploadAll()">全部上传</button>
      </div>
    </div>

    <!-- 任务列表 -->
    <div class="task-list" id="taskList"></div>

    <!-- 汇总 -->
    <div class="summary-card" id="summaryCard">
      <h3>导入完成</h3>
      <div class="summary-stats">
        <div class="summary-stat"><div class="num green" id="sumSuccess">0</div><div class="label">成功</div></div>
        <div class="summary-stat"><div class="num red" id="sumFailed">0</div><div class="label">失败</div></div>
        <div class="summary-stat"><div class="num gray" id="sumSkipped">0</div><div class="label">跳过</div></div>
      </div>
      <div class="summary-btns">
        <button class="batch-btn secondary" onclick="goChat()">返回查询</button>
        <button class="batch-btn primary" onclick="resetAll()">继续导入</button>
      </div>
    </div>
  </div>

<script>
  const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8000';

  // 权限检查
  (function checkAuth() {
    const token = localStorage.getItem('access_token');
    const expires = localStorage.getItem('token_expires');
    if (!token || !expires || Date.now() > Number(expires)) {
      window.location.href = '/html';
      return;
    }
    const info = JSON.parse(localStorage.getItem('user_info') || '{}');
    if (info.username) document.getElementById('userName').textContent = info.username;
  })();

  function goChat() {
    const qBase = location.origin.startsWith('http') ? location.origin.replace(/:\d+/, ':8001') : 'http://127.0.0.1:8001';
    window.open(qBase + '/html', '_blank');
  }

  let pendingFiles = [];
  let tasks = [];
  let pollTimers = {};

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const taskList = document.getElementById('taskList');

  // 节点权重
  const NODE_WEIGHTS = {
    node_entry: 5,
    node_pdf_to_md: 25,
    node_md_img: 15,
    node_document_split: 10,
    node_item_name_recognition: 15,
    node_bge_embedding: 20,
    node_import_milvus: 10
  };
  function calcProgress(doneList) {
    if (!Array.isArray(doneList)) return 0;
    return doneList.reduce((sum, name) => sum + (NODE_WEIGHTS[name] || 0), 0);
  }

  // 文件类型映射
  function getFileType(name) {
    const ext = name.split('.').pop().toLowerCase();
    const map = {
      pdf: { icon: '📕', cls: 'pdf', label: 'PDF' },
      md: { icon: '📗', cls: 'md', label: 'Markdown' },
      docx: { icon: '📘', cls: 'docx', label: 'Word' },
      pptx: { icon: '📙', cls: 'pptx', label: 'PPT' },
      txt: { icon: '📄', cls: 'txt', label: 'TXT' },
      jpg: { icon: '🖼️', cls: 'img', label: 'JPG' },
      jpeg: { icon: '🖼️', cls: 'img', label: 'JPEG' },
      png: { icon: '🖼️', cls: 'img', label: 'PNG' },
    };
    return map[ext] || { icon: '📄', cls: 'txt', label: ext.toUpperCase() };
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1048576).toFixed(1) + ' MB';
  }

  // 拖拽
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    addFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', e => { addFiles(e.target.files); fileInput.value = ''; });

  function addFiles(fileList) {
    Array.from(fileList).forEach(f => {
      pendingFiles.push(f);
    });
    renderPending();
  }

  function renderPending() {
    const batchBar = document.getElementById('batchBar');
    const count = pendingFiles.length;
    if (count === 0) {
      batchBar.classList.remove('show');
      return;
    }
    batchBar.classList.add('show');
    document.getElementById('fileCount').textContent = count;

    // 渲染待上传列表
    const pendingTasks = taskList.querySelectorAll('.task-card.pending');
    pendingTasks.forEach(el => el.remove());

    pendingFiles.forEach((f, i) => {
      const ft = getFileType(f.name);
      const id = 'pending-' + i;
      taskList.insertAdjacentHTML('afterbegin', `
        <div class="task-card pending" id="${id}">
          <div class="task-header">
            <div class="task-icon ${ft.cls}">${ft.icon}</div>
            <div class="task-info">
              <div class="task-name">${esc(f.name)}</div>
              <div class="task-meta">${formatSize(f.size)} · ${ft.label}</div>
            </div>
            <span class="task-status uploading">待上传</span>
          </div>
        </div>`);
    });
  }

  function clearPending() {
    pendingFiles = [];
    taskList.querySelectorAll('.task-card.pending').forEach(el => el.remove());
    document.getElementById('batchBar').classList.remove('show');
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // 上传全部
  async function uploadAll() {
    const files = [...pendingFiles];
    if (files.length === 0) return;
    pendingFiles = [];
    document.getElementById('batchBar').classList.remove('show');
    taskList.querySelectorAll('.task-card.pending').forEach(el => el.remove());

    // 逐个上传
    for (const file of files) {
      await uploadSingleFile(file);
    }
  }

  async function uploadSingleFile(file) {
    const ft = getFileType(file.name);
    const taskId = 'task-' + Math.random().toString(36).slice(2);
    const token = localStorage.getItem('access_token');

    // 创建任务卡片
    const cardHtml = `
      <div class="task-card" id="${taskId}">
        <div class="task-header">
          <div class="task-icon ${ft.cls}">${ft.icon}</div>
          <div class="task-info">
            <div class="task-name">${esc(file.name)}</div>
            <div class="task-meta">${formatSize(file.size)} · ${ft.label}</div>
          </div>
          <span class="task-status uploading">上传中</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-info">
            <span class="progress-label">准备上传...</span>
            <span class="progress-pct">0%</span>
          </div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:0%;background:var(--warning)"></div></div>
        </div>
        <div class="log-toggle" onclick="toggleLog(this)">
          <span class="arrow">▸</span> 日志
        </div>
        <ul class="log-list"></ul>
      </div>`;
    taskList.insertAdjacentHTML('beforeend', cardHtml);
    const card = document.getElementById(taskId);
    scrollToCard(card);

    try {
      // 上传
      const formData = new FormData();
      formData.append('files', file);

      const res = await fetch(`${API_BASE}/upload`, {
        method: 'POST',
        headers: token ? { 'Authorization': 'Bearer ' + token } : {},
        body: formData
      });

      if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
          setStatus(card, 'failed', '权限不足');
          addLog(card, '权限不足，请重新登录', 'failed');
          return;
        }
        throw new Error('上传失败');
      }

      const data = await res.json();
      const serverTaskId = data.task_ids && data.task_ids[0];
      if (!serverTaskId) throw new Error('未返回 task_id');

      // 开始轮询
      setStatus(card, 'processing', '处理中');
      updateProgress(card, 5, '文件已上传，开始处理...');
      addLog(card, '文件上传完成', 'done');

      pollTimers[serverTaskId] = setInterval(() => pollStatus(serverTaskId, card), 2000);

    } catch(e) {
      setStatus(card, 'failed', '失败');
      addLog(card, '上传失败: ' + e.message, 'failed');
    }
  }

  function pollStatus(serverTaskId, card) {
    fetch(`${API_BASE}/status/${serverTaskId}`)
      .then(r => r.json())
      .then(data => {
        const done = data.done_list || [];
        const running = data.running_list || [];
        const progress = data.progress !== undefined ? data.progress : calcProgress(done);

        updateProgress(card, progress, getNodeLabel(running[0] || done[done.length-1]));
        renderLogList(card, done, running);

        if (data.status === 'completed') {
          clearInterval(pollTimers[serverTaskId]);
          setStatus(card, 'completed', '已完成');
          updateProgress(card, 100, '导入完成');
          addLog(card, '全部节点执行完成', 'done');
          checkSummary();
        } else if (data.status === 'failed') {
          clearInterval(pollTimers[serverTaskId]);
          setStatus(card, 'failed', '失败');
          addLog(card, '导入失败', 'failed');
          checkSummary();
        }
      })
      .catch(() => {});
  }

  function getNodeLabel(name) {
    const labels = {
      node_entry: '入口分发',
      node_pdf_to_md: 'PDF 解析',
      node_md_img: '图片处理',
      node_document_split: '文档切分',
      node_item_name_recognition: '主体识别',
      node_bge_embedding: '向量化',
      node_import_milvus: 'Milvus 入库'
    };
    return labels[name] || name || '';
  }

  function setStatus(card, status, text) {
    const badge = card.querySelector('.task-status');
    badge.className = 'task-status ' + status;
    badge.textContent = text;
  }

  function updateProgress(card, pct, label) {
    const fill = card.querySelector('.progress-bar-fill');
    const pctEl = card.querySelector('.progress-pct');
    const labelEl = card.querySelector('.progress-label');
    fill.style.width = Math.min(100, pct) + '%';
    pctEl.textContent = Math.round(pct) + '%';
    if (label) labelEl.textContent = label;

    // 颜色变化
    if (pct >= 100) { fill.style.background = 'var(--success)'; pctEl.style.color = 'var(--success)'; }
    else if (pct >= 70) { fill.style.background = '#8b5cf6'; pctEl.style.color = '#8b5cf6'; }
    else if (pct >= 30) { fill.style.background = 'var(--brand)'; pctEl.style.color = 'var(--brand)'; }
    else { fill.style.background = 'var(--warning)'; pctEl.style.color = 'var(--warning)'; }
  }

  function addLog(card, text, type) {
    const ul = card.querySelector('.log-list');
    const li = document.createElement('li');
    li.className = type || '';
    li.textContent = text;
    ul.appendChild(li);
  }

  function renderLogList(card, doneList, runningList) {
    const ul = card.querySelector('.log-list');
    ul.innerHTML = '';
    (doneList||[]).forEach(n => {
      const li = document.createElement('li');
      li.className = 'done';
      li.textContent = `✅ ${getNodeLabel(n)} 已完成`;
      ul.appendChild(li);
    });
    (runningList||[]).forEach(n => {
      const li = document.createElement('li');
      li.className = 'running';
      li.textContent = `⏳ ${getNodeLabel(n)} 处理中...`;
      ul.appendChild(li);
    });
  }

  function toggleLog(el) {
    const ul = el.nextElementSibling;
    const arrow = el.querySelector('.arrow');
    if (ul.classList.contains('show')) {
      ul.classList.remove('show');
      arrow.style.transform = 'rotate(0)';
    } else {
      ul.classList.add('show');
      arrow.style.transform = 'rotate(90deg)';
    }
  }

  function scrollToCard(card) {
    setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
  }

  // 汇总
  function checkSummary() {
    const allCards = taskList.querySelectorAll('.task-card:not(.pending)');
    let success = 0, failed = 0;
    allCards.forEach(card => {
      const s = card.querySelector('.task-status');
      if (s.classList.contains('completed')) success++;
      else if (s.classList.contains('failed')) failed++;
    });
    const total = allCards.length;
    if (success + failed >= total && total > 0) {
      document.getElementById('sumSuccess').textContent = success;
      document.getElementById('sumFailed').textContent = failed;
      document.getElementById('sumSkipped').textContent = 0;
      document.getElementById('summaryCard').classList.add('show');
    }
  }

  function resetAll() {
    document.getElementById('summaryCard').classList.remove('show');
    taskList.innerHTML = '';
    tasks = [];
  }
</script>
</body>
</html>
