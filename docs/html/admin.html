<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>掌柜智库 - 管理后台</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --brand:#4f6ef7;--brand2:#7c5cfc;
      --bg:#f5f7fa;--card:#fff;--text:#1a1a2e;--muted:#8b8fa3;
      --border:#e8eaef;--success:#22c55e;--error:#ef4444;--warning:#f59e0b;
      --radius:12px;
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;
    }

    /* 顶栏 */
    .topbar{
      position:sticky;top:0;z-index:50;
      display:flex;align-items:center;gap:12px;
      padding:0 24px;height:56px;
      background:#fff;border-bottom:1px solid var(--border);
    }
    .topbar .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center}
    .topbar .logo svg{width:18px;height:18px;fill:#fff}
    .topbar h2{font-size:15px;font-weight:600;margin-right:8px}
    .topbar .sub{font-size:12px;color:var(--muted)}
    .topbar .spacer{flex:1}
    .topbar .user-tag{
      display:flex;align-items:center;gap:6px;
      padding:6px 12px;border-radius:20px;background:#f5f6f8;font-size:13px;
    }
    .topbar .user-tag .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
    .btn-logout{
      padding:6px 14px;border:1px solid var(--border);border-radius:8px;
      background:#fff;font-size:13px;cursor:pointer;color:var(--text);transition:all .2s;
    }
    .btn-logout:hover{border-color:var(--error);color:var(--error)}

    /* 布局 */
    .layout{display:flex;min-height:calc(100vh - 56px)}
    .sidebar{
      width:200px;background:#fff;border-right:1px solid var(--border);
      padding:16px 0;flex-shrink:0;
    }
    .nav-item{
      display:flex;align-items:center;gap:10px;
      padding:10px 20px;font-size:14px;color:var(--muted);
      cursor:pointer;transition:all .2s;border-left:3px solid transparent;
    }
    .nav-item:hover{background:#f5f6f8;color:var(--text)}
    .nav-item.active{color:var(--brand);background:rgba(79,110,247,.06);border-left-color:var(--brand);font-weight:600}
    .nav-item svg{width:18px;height:18px;flex-shrink:0}

    .main{flex:1;padding:24px;overflow:auto}
    .page-title{font-size:18px;font-weight:700;margin-bottom:20px}

    /* 搜索栏 */
    .toolbar{
      display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;
    }
    .search-box{
      flex:1;min-width:200px;position:relative;
    }
    .search-box input{
      width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--border);
      border-radius:10px;font-size:14px;outline:none;transition:border-color .2s;
    }
    .search-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,110,247,.08)}
    .search-box .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
    .search-box .s-icon svg{width:16px;height:16px}
    .filter-select{
      padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;
      font-size:14px;background:#fff;outline:none;cursor:pointer;min-width:120px;
    }

    /* 表格 */
    .table-card{
      background:#fff;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;
    }
    table{width:100%;border-collapse:collapse}
    th{
      text-align:left;padding:12px 16px;font-size:13px;font-weight:600;
      color:var(--muted);background:#fafbfc;border-bottom:1px solid var(--border);
    }
    td{padding:12px 16px;font-size:14px;border-bottom:1px solid #f2f3f5}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#f8f9ff}

    .badge{
      display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;
    }
    .badge-admin{background:#fee2e2;color:#dc2626}
    .badge-whitelist{background:#d1fae5;color:#059669}
    .badge-user{background:#dbeafe;color:#2563eb}

    .action-btn{
      padding:5px 14px;border:none;border-radius:8px;font-size:12px;
      font-weight:500;cursor:pointer;transition:opacity .2s;
    }
    .action-btn:hover{opacity:.85}
    .action-btn.add{background:var(--success);color:#fff}
    .action-btn.remove{background:var(--error);color:#fff}
    .action-btn:disabled{opacity:.4;cursor:not-allowed}

    /* 分页 */
    .pagination{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 16px;border-top:1px solid var(--border);
    }
    .pagination .info{font-size:13px;color:var(--muted)}
    .page-btns{display:flex;gap:4px}
    .page-btn{
      width:32px;height:32px;border:1px solid var(--border);border-radius:8px;
      background:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    }
    .page-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
    .page-btn:disabled{opacity:.4;cursor:not-allowed}

    /* 弹窗 */
    .modal-mask{
      position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
      display:none;align-items:center;justify-content:center;
    }
    .modal-mask.show{display:flex}
    .modal{
      background:#fff;border-radius:16px;padding:28px;width:400px;max-width:90vw;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
    }
    .modal h3{font-size:16px;font-weight:700;margin-bottom:12px}
    .modal p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:24px}
    .modal .btns{display:flex;gap:10px;justify-content:flex-end}
    .modal .btns button{
      padding:9px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-weight:500;
    }
    .modal .btn-cancel{background:#f5f6f8;color:var(--text)}
    .modal .btn-confirm{background:var(--brand);color:#fff}
    .modal .btn-danger{background:var(--error);color:#fff}

    .empty-state{
      text-align:center;padding:60px 20px;color:var(--muted);
    }
    .empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}

    /* 页面切换 */
    .page-section{display:none}
    .page-section.active{display:block}

    /* 设置页 */
    .setting-card{
      background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:24px;margin-bottom:16px;
    }
    .setting-card h3{font-size:15px;font-weight:600;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f2f3f5}
    .setting-row{display:flex;align-items:center;margin-bottom:14px;gap:12px}
    .setting-row label{width:120px;font-size:14px;color:var(--muted);flex-shrink:0}
    .setting-row input,.setting-row select{
      flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;
    }
    .setting-row input:focus{border-color:var(--brand)}
    .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
    .status-dot.green{background:var(--success)}

    @media(max-width:768px){
      .sidebar{display:none}
      .toolbar{flex-direction:column}
      .search-box{min-width:100%}
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>
    <h2>掌柜智库</h2>
    <span class="sub">管理后台</span>
    <div class="spacer"></div>
    <div class="user-tag"><span class="dot"></span><span id="adminName">admin</span></div>
    <button class="btn-logout" onclick="logout()">退出</button>
  </div>

  <div style="display:flex;min-height:calc(100vh - 56px)">
    <div class="sidebar">
      <div class="nav-item active" data-page="users" onclick="switchPage('users')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        用户管理
      </div>
      <div class="nav-item" data-page="settings" onclick="switchPage('settings')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        系统设置
      </div>
    </div>

    <div class="main">
      <!-- 用户管理页 -->
      <div class="page-section active" id="page-users">
        <div class="page-title">用户管理</div>
        <div class="toolbar">
          <div class="search-box">
            <span class="s-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
            <input type="text" id="searchInput" placeholder="搜索用户名..." oninput="renderUsers()" />
          </div>
          <select class="filter-select" id="roleFilter" onchange="renderUsers()">
            <option value="">全部角色</option>
            <option value="admin">管理员</option>
            <option value="whitelist">白名单</option>
            <option value="user">普通用户</option>
          </select>
        </div>
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th style="width:50px">#</th>
                <th>用户名</th>
                <th>角色</th>
                <th>邮箱</th>
                <th>注册时间</th>
                <th style="width:140px">操作</th>
              </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
          </table>
          <div class="pagination">
            <span class="info" id="pageInfo">共 0 条</span>
            <div class="page-btns" id="pageBtns"></div>
          </div>
        </div>
      </div>

      <!-- 系统设置页 -->
      <div class="page-section" id="page-settings">
        <div class="page-title">系统设置</div>
        <div class="setting-card">
          <h3>基础配置</h3>
          <div class="setting-row">
            <label>知识库名称</label>
            <input type="text" value="掌柜智库" />
          </div>
          <div class="setting-row">
            <label>历史保留天数</label>
            <input type="number" value="30" />
          </div>
          <div class="setting-row">
            <label>最大上传文件</label>
            <input type="text" value="50 MB" />
          </div>
        </div>
        <div class="setting-card">
          <h3>服务状态</h3>
          <div class="setting-row">
            <label>Milvus</label>
            <span><span class="status-dot green"></span>已连接 (19530)</span>
          </div>
          <div class="setting-row">
            <label>MongoDB</label>
            <span><span class="status-dot green"></span>已连接 (27017)</span>
          </div>
          <div class="setting-row">
            <label>MinIO</label>
            <span><span class="status-dot green"></span>已连接 (9000)</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div class="modal-mask" id="modal">
    <div class="modal">
      <h3 id="modalTitle">确认操作</h3>
      <p id="modalMsg"></p>
      <div class="btns">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-confirm" id="modalConfirm">确认</button>
      </div>
    </div>
  </div>

<script>
  const AUTH_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8002';
  const token = localStorage.getItem('access_token');

  let allUsers = [];
  let currentPage = 1;
  const pageSize = 15;

  // 权限检查
  (function checkAuth() {
    if (!token) { window.location.href = '/html'; return; }
    const info = JSON.parse(localStorage.getItem('user_info') || '{}');
    if (info.username) document.getElementById('adminName').textContent = info.username;
    if (info.role !== 'admin') { alert('仅管理员可访问'); window.location.href = '/html'; }
  })();

  function authHeaders() {
    return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
  }

  // 页面切换
  function switchPage(page) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
    document.querySelectorAll('.page-section').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
  }

  // 加载用户
  async function loadUsers() {
    try {
      const res = await fetch(`${AUTH_BASE}/admin/users?page=1&page_size=200`, { headers: authHeaders() });
      if (res.status === 401) { logout(); return; }
      const data = await res.json();
      allUsers = (data.data && data.data.items) || [];
      renderUsers();
    } catch (e) {
      console.error('加载用户失败', e);
    }
  }

  function renderUsers() {
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    const role = document.getElementById('roleFilter').value;
    let filtered = allUsers.filter(u => {
      if (keyword && !u.username.toLowerCase().includes(keyword)) return false;
      if (role && u.role !== role) return false;
      return true;
    });
    const total = filtered.length;
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * pageSize;
    const pageData = filtered.slice(start, start + pageSize);

    const tbody = document.getElementById('userTableBody');
    if (pageData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><div>暂无数据</div></div></td></tr>';
    } else {
      tbody.innerHTML = pageData.map((u, i) => {
        const idx = start + i + 1;
        const badgeClass = u.role === 'admin' ? 'badge-admin' : u.role === 'whitelist' ? 'badge-whitelist' : 'badge-user';
        const roleLabel = u.role === 'admin' ? '管理员' : u.role === 'whitelist' ? '白名单' : '普通用户';
        const ts = u.created_at ? new Date(u.created_at).toLocaleDateString('zh-CN') : '-';
        let action = '-';
        if (u.role === 'user') {
          action = `<button class="action-btn add" onclick="addWhitelist('${u.user_id}','${u.username}')">添加白名单</button>`;
        } else if (u.role === 'whitelist') {
          action = `<button class="action-btn remove" onclick="removeWhitelist('${u.user_id}','${u.username}')">移除白名单</button>`;
        }
        return `<tr>
          <td>${idx}</td>
          <td><strong>${esc(u.username)}</strong></td>
          <td><span class="badge ${badgeClass}">${roleLabel}</span></td>
          <td>${esc(u.email || '-')}</td>
          <td>${ts}</td>
          <td>${action}</td>
        </tr>`;
      }).join('');
    }

    document.getElementById('pageInfo').textContent = `共 ${total} 条`;
    const btns = document.getElementById('pageBtns');
    btns.innerHTML = '';
    const addBtn = (label, pg, disabled, active) => {
      const b = document.createElement('button');
      b.className = 'page-btn' + (active ? ' active' : '');
      b.textContent = label;
      b.disabled = disabled;
      b.onclick = () => { currentPage = pg; renderUsers(); };
      btns.appendChild(b);
    };
    addBtn('«', 1, currentPage === 1);
    addBtn('‹', currentPage - 1, currentPage === 1);
    for (let p = Math.max(1, currentPage - 2); p <= Math.min(totalPages, currentPage + 2); p++) {
      addBtn(String(p), p, false, p === currentPage);
    }
    addBtn('›', currentPage + 1, currentPage === totalPages);
    addBtn('»', totalPages, currentPage === totalPages);
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function showModal(title, msg, btnText, btnClass, onConfirm) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').textContent = msg;
    const btn = document.getElementById('modalConfirm');
    btn.textContent = btnText;
    btn.className = btnClass;
    btn.onclick = () => { closeModal(); onConfirm(); };
    document.getElementById('modal').classList.add('show');
  }
  function closeModal() { document.getElementById('modal').classList.remove('show'); }

  async function addWhitelist(userId, username) {
    showModal('添加白名单', `确定将用户 "${username}" 添加至白名单吗？添加后该用户将获得文件导入权限。`, '确认添加', 'btn-confirm', async () => {
      try {
        const res = await fetch(`${AUTH_BASE}/admin/whitelist`, {
          method: 'POST', headers: authHeaders(),
          body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        if (res.ok) { loadUsers(); } else { alert(data.message || '操作失败'); }
      } catch (e) { alert('网络错误'); }
    });
  }

  async function removeWhitelist(userId, username) {
    showModal('移除白名单', `确定将用户 "${username}" 从白名单移除吗？移除后该用户将失去文件导入权限。`, '确认移除', 'btn-danger', async () => {
      try {
        const res = await fetch(`${AUTH_BASE}/admin/whitelist/${userId}`, {
          method: 'DELETE', headers: authHeaders()
        });
        const data = await res.json();
        if (res.ok) { loadUsers(); } else { alert(data.message || '操作失败'); }
      } catch (e) { alert('网络错误'); }
    });
  }

  function logout() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('token_expires');
    localStorage.removeItem('user_info');
    window.location.href = '/html';
  }

  loadUsers();
</script>
</body>
</html>
