<!-- 掌柜智库 — 单页应用：智能问答 + 文件导入 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>掌柜智库</title>
  <style>
    :root {
      --sidebar-w: 220px;
      --sidebar-bg: #23252b;
      --sidebar-active: rgba(51,112,255,.15);
      --sidebar-text: #b0b8c4;
      --sidebar-text-active: #fff;
      --bg: #f3f5f7;
      --panel: #ffffff;
      --text: #1f2d3d;
      --muted: #7a869a;
      --brand: #1aa7ff;
      --brand2: #5b7cfa;
      --bubble-user: #1aa7ff;
      --bubble-bot: #ffffff;
      --border: #e6e9ef;
      --success: #00b42a;
      --error: #f53f3f;
      --warning: #ff7d00;
      --shadow: 0 10px 30px rgba(31,45,61,.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ==================== 侧边栏 ==================== */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      color: var(--sidebar-text);
      user-select: none;
    }
    .sidebar-brand {
      padding: 20px 18px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .sidebar-brand .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow: 0 6px 16px rgba(26,167,255,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #fff; font-weight: 700;
    }
    .sidebar-brand span {
      font-size: 15px; font-weight: 600; color: #fff;
    }
    .sidebar-nav {
      flex: 1;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      color: var(--sidebar-text);
      transition: all .15s;
    }
    .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .nav-item.active {
      background: var(--sidebar-active);
      color: var(--sidebar-text-active);
      font-weight: 500;
    }
    .nav-item .nav-icon { font-size: 18px; width: 22px; text-align: center; }
    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid rgba(255,255,255,.06);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-footer .user-name {
      font-size: 13px; color: #fff; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar-footer .logout-btn {
      background: none; border: 1px solid rgba(255,255,255,.15);
      color: var(--sidebar-text); padding: 6px 0; border-radius: 8px;
      cursor: pointer; font-size: 12px; transition: all .15s;
    }
    .sidebar-footer .logout-btn:hover {
      border-color: var(--error); color: var(--error);
    }

    /* ==================== 主内容区 ==================== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ==================== 模块容器 ==================== */
    .module { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .module.active { display: flex; }

    /* ==================== 问答模块 ==================== */
    .chat-topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(26,167,255,.06), rgba(91,124,250,.06));
    }
    .chat-topbar .title { font-size: 15px; font-weight: 600; }
    .chat-topbar .top-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    .pill {
      font-size: 12px; color: var(--muted); border: 1px solid var(--border);
      padding: 5px 10px; border-radius: 999px; background: #fff;
    }
    .chat-area {
      flex: 1; overflow: auto; padding: 16px 14px 10px;
      background: linear-gradient(180deg, rgba(26,167,255,.04), transparent 40%),
                  linear-gradient(0deg, rgba(91,124,250,.04), transparent 45%);
    }
    .dayline { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 14px; }
    .msg { display: flex; gap: 10px; margin: 10px 0; align-items: flex-end; }
    .msg.user { justify-content: flex-end; }
    .msg > div:not(.avatar) { flex: 1; min-width: 0; }
    .msg.user > div:not(.avatar) { display: flex; flex-direction: column; align-items: flex-end; }
    .avatar {
      width: 34px; height: 34px; border-radius: 10px;
      background: #e9eef7; display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #3b4a5a; flex: 0 0 auto;
    }
    .avatar.bot { background: linear-gradient(135deg, rgba(26,167,255,.18), rgba(91,124,250,.18)); }
    .bubble {
      max-width: min(720px, 76%); display: inline-block; border-radius: 14px;
      padding: 10px 12px; border: 1px solid var(--border); background: var(--bubble-bot);
      position: relative; line-height: 1.55; font-size: 14px;
      white-space: pre-wrap; overflow-wrap: break-word;
    }
    .msg.user .bubble { background: var(--bubble-user); color: #fff; border-color: transparent; }
    .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .msg.user .meta { color: rgba(255,255,255,.85); }
    details.progress {
      margin-top: 8px; border: 1px dashed rgba(122,134,154,.45);
      border-radius: 12px; padding: 8px 10px; background: rgba(122,134,154,.06);
    }
    details.progress summary { cursor: pointer; user-select: none; color: var(--muted); font-size: 12px; }
    .progress ul { margin: 8px 0 0 18px; padding: 0; }
    .progress li { margin: 4px 0; font-size: 12px; color: #56657a; }
    .answer-images { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
    .answer-images img {
      display: block; max-width: min(100%, 600px); max-height: 600px;
      width: auto; height: auto; border-radius: 12px;
      border: 1px solid var(--border); box-shadow: 0 10px 24px rgba(31,45,61,.10); background: #fff;
    }
    .answer-images a { font-size: 12px; color: var(--muted); text-decoration: none; word-break: break-all; }
    .typing { display: inline-flex; gap: 6px; align-items: center; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #9aa6b2;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity: .6; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    .composer {
      border-top: 1px solid var(--border); padding: 12px 14px;
      display: flex; gap: 10px; align-items: flex-end; background: #fff;
    }
    .composer textarea {
      flex: 1; resize: none; min-height: 44px; max-height: 140px;
      padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border);
      outline: none; font-size: 14px; line-height: 1.5;
    }
    .composer textarea:focus { border-color: rgba(26,167,255,.6); box-shadow: 0 0 0 3px rgba(26,167,255,.12); }
    .send-btn {
      width: 88px; height: 44px; border: none; border-radius: 12px;
      cursor: pointer; font-size: 14px; color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
    }
    .send-btn:disabled { opacity: .6; cursor: not-allowed; }
    .hint { padding: 0 14px 10px; color: var(--muted); font-size: 12px; background: #fff; }
    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px;
      background: #f7f9fc; color: #3b4a5a;
    }

    /* ==================== 导入模块 ==================== */
    .import-content {
      flex: 1; overflow: auto; padding: 24px;
      display: flex; flex-direction: column; align-items: center;
    }
    .import-box {
      width: 100%; max-width: 800px;
    }
    .import-title {
      font-size: 18px; font-weight: 600; margin-bottom: 20px; color: var(--text);
    }
    .drop-zone {
      border: 2px dashed var(--brand); border-radius: 12px;
      padding: 40px; text-align: center; cursor: pointer;
      transition: background-color .2s; margin-bottom: 20px;
    }
    .drop-zone:hover { background: rgba(26,167,255,.06); }
    .drop-zone .icon { font-size: 48px; color: var(--brand); margin-bottom: 10px; }
    .drop-zone p { color: var(--muted); font-size: 14px; }
    .file-input { display: none; }
    .file-item {
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .file-info { display: flex; flex-direction: column; flex: 1; margin-right: 16px; }
    .file-name { font-weight: 600; font-size: 14px; color: var(--text); }
    .file-size { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .status-badge {
      padding: 4px 12px; border-radius: 999px; font-size: 12px;
      font-weight: 600; color: #fff; min-width: 72px; text-align: center;
    }
    .status-uploading { background: var(--warning); }
    .status-processing { background: var(--brand); }
    .status-completed { background: var(--success); }
    .status-error { background: var(--error); }
    .progress-bar-container {
      width: 100%; height: 4px; background: #f0f0f0; margin-top: 8px;
      border-radius: 2px; overflow: hidden; display: none;
    }
    .progress-bar {
      height: 100%; background: var(--warning); width: 0%;
      transition: width .3s, background-color .3s;
    }
    .log-details { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .log-details summary { cursor: pointer; user-select: none; color: #6c7a89; }
    .log-list { margin: 6px 0 0 16px; padding: 0; }
    .log-list li { margin: 2px 0; line-height: 1.4; }

    /* ==================== 全局组件 ==================== */
    .btn-sm {
      border: none; padding: 6px 12px; border-radius: 8px;
      font-size: 12px; cursor: pointer; transition: all .15s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-outline {
      background: #fff; border: 1px solid var(--border); color: var(--text);
    }
    .btn-outline:hover { border-color: var(--brand); color: var(--brand); }
    .btn-danger { background: none; border: 1px solid var(--error); color: var(--error); }
    .btn-danger:hover { background: var(--error); color: #fff; }
  </style>
</head>
<body>

<!-- ==================== 侧边栏 ==================== -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="logo">智</div>
    <span>掌柜智库</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" data-module="chat" onclick="switchModule('chat')">
      <span class="nav-icon">&#x1f4ac;</span>
      <span>智能问答</span>
    </div>
    <div class="nav-item" data-module="import" onclick="switchModule('import')">
      <span class="nav-icon">&#x1f4c1;</span>
      <span>文件导入</span>
    </div>
  </nav>
  <div class="sidebar-footer">
    <div class="user-name" id="sidebarUser">未登录</div>
    <button class="logout-btn" onclick="logout()">退出登录</button>
  </div>
</aside>

<!-- ==================== 主内容 ==================== -->
<div class="main">

  <!-- ========== 模块 A：智能问答 ========== -->
  <div class="module active" id="modChat">
    <div class="chat-topbar">
      <span class="title">智能问答</span>
      <div class="top-actions">
        <label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;color:var(--muted)">
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <span class="pill" id="apiPill">API: 未连接</span>
        <button class="btn-sm btn-outline" id="btnClear">清空对话</button>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="dayline">今天</div>
      <div class="msg bot">
        <div class="avatar bot">掌柜智库</div>
        <div>
          <div class="bubble">你好，我是掌柜智库知识库客服。你可以直接提问，我会在"阶段进度"里展示处理过程。</div>
          <div class="meta">提示：可以问"如何使用万用表测量电压？"</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="chatInput" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send-btn" id="sendBtn">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
  </div>

  <!-- ========== 模块 B：文件导入 ========== -->
  <div class="module" id="modImport">
    <div class="import-content">
      <div class="import-box">
        <div class="import-title">知识库文件导入</div>

        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
          <div class="icon">&#x2601;&#xFE0F;</div>
          <p>点击或拖拽文件到此处</p>
          <p style="font-size:12px;color:var(--muted);margin-top:6px">支持 PDF / MD / DOCX / PPTX / TXT / JPG / PNG</p>
          <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md,.docx,.pptx,.txt,.jpg,.jpeg,.png">
        </div>

        <div id="fileList"></div>
      </div>
    </div>
  </div>

</div>

<script>
  // ==================== 配置 ====================
  const QUERY_API = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8001';
  const IMPORT_API = 'http://127.0.0.1:8000';
  const AUTH_BASE = 'http://127.0.0.1:8002';

  // ==================== 跨域 Token 接收 ====================
  // 登录页（8002）跳转时会将 token 附在 URL 参数中，此处接收并存入本域 localStorage
  (function receiveTokenFromURL() {
    const p = new URLSearchParams(window.location.search);
    const token = p.get('_token');
    if (token) {
      localStorage.setItem('access_token', token);
      localStorage.setItem('token_expires', p.get('_expires') || '');
      localStorage.setItem('username', p.get('_user') || '');
      localStorage.setItem('user_id', p.get('_uid') || '');
      localStorage.setItem('user_role', p.get('_role') || 'user');
      window.history.replaceState({}, '', location.pathname);
    }
  })();

  // ==================== 认证 ====================
  function checkAuth() {
    const token = localStorage.getItem('access_token');
    const expires = Number(localStorage.getItem('token_expires') || 0);
    if (!token || Date.now() >= expires) return null;
    return token;
  }
  function authHeaders() {
    const token = checkAuth();
    return token ? { 'Authorization': 'Bearer ' + token } : {};
  }
  function ensureAuth() {
    const token = checkAuth();
    if (!token) {
      window.location.href = AUTH_BASE + '/html?redirect_to=' + encodeURIComponent(window.location.href);
      return false;
    }
    return true;
  }
  function logout() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('token_expires');
    localStorage.removeItem('username');
    localStorage.removeItem('user_id');
    localStorage.removeItem('user_role');
    window.location.href = AUTH_BASE + '/html';
  }

  // 页面加载时显示用户名
  (function() {
    const name = localStorage.getItem('username');
    if (name) document.getElementById('sidebarUser').textContent = name;
  })();

  // ==================== 模块切换 ====================
  function switchModule(name) {
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.module === name);
    });
    document.getElementById('modChat').classList.toggle('active', name === 'chat');
    document.getElementById('modImport').classList.toggle('active', name === 'import');
  }

  // ==================== 工具函数 ====================
  function escapeHtml(s) {
    return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
      .replaceAll('"','&quot;').replaceAll("'","&#039;");
  }
  function nowTime() {
    return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }
  function formatTime(ts) {
    if (!ts) return nowTime();
    const d = new Date(Number(ts) * 1000);
    return isNaN(d.getTime()) ? nowTime() : d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }

  // ==================== 问答模块 ====================
  const chatArea = document.getElementById('chatArea');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const apiPill = document.getElementById('apiPill');
  const btnClear = document.getElementById('btnClear');
  const streamToggle = document.getElementById('streamToggle');

  let sessionId = localStorage.getItem('kb_session_id');
  if (!sessionId) {
    sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('kb_session_id', sessionId);
  }

  function scrollToBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

  // --- 图片处理 ---
  function isImageUrl(url) {
    try { return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(new URL(url).pathname); }
    catch(e) { return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || ''); }
  }
  function normalizeUrl(s) { return String(s || '').trim().replace(/\s/g, '%20'); }
  function dedupeKeepOrder(arr) {
    const seen = new Set(), out = [];
    for (const x of (Array.isArray(arr) ? arr : [])) {
      const v = String(x || '');
      if (v && !seen.has(v)) { seen.add(v); out.push(v); }
    }
    return out;
  }
  function extractUrlsLoose(text) {
    const matches = String(text || '').match(/(https?:\/\/[^\s]+)/g) || [];
    const trimTail = u => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
    const trimHead = u => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
    return dedupeKeepOrder(matches.map(m => trimHead(trimTail(m))).filter(Boolean));
  }
  function parseAnswerAndImages(text) {
    const raw = String(text || '');
    const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
    let m, lastIdx = -1, lastLen = 0;
    while ((m = re.exec(raw)) !== null) { lastIdx = m.index; lastLen = m[0].length; }
    if (lastIdx === -1) return { text: raw, images: [] };
    const before = raw.slice(0, lastIdx).trimEnd();
    const after = raw.slice(lastIdx + lastLen).trim();
    const urls = [];
    for (const line of after.split(/\r?\n/).map(l => l.trim()).filter(Boolean)) {
      if (line.startsWith('http://') || line.startsWith('https://')) urls.push(line);
      else extractUrlsLoose(line).forEach(u => urls.push(u));
    }
    const seen = new Set(), images = [];
    for (const u of urls) {
      const n = normalizeUrl(u);
      if (isImageUrl(n) && !seen.has(n)) { seen.add(n); images.push(n); }
    }
    return { text: before, images };
  }
  function renderAnswerWithImages(el, answerText, candidateImageUrls) {
    const { text, images: blockImgs } = parseAnswerAndImages(answerText);
    const candidates = (Array.isArray(candidateImageUrls) ? candidateImageUrls : []).map(normalizeUrl).filter(isImageUrl);
    const looseImgs = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
    const allImgs = Array.from(new Set([...(blockImgs || []), ...candidates, ...looseImgs]));
    el.textContent = '';
    const textEl = document.createElement('div');
    textEl.className = 'answer-text';
    textEl.textContent = (text || '').trim() || '（已完成，但未返回答案）';
    el.appendChild(textEl);
    if (allImgs.length > 0) {
      const wrap = document.createElement('div');
      wrap.className = 'answer-images';
      for (const url of allImgs) {
        const safe = normalizeUrl(url);
        const img = document.createElement('img');
        img.loading = 'lazy'; img.src = safe; img.alt = '参考图片';
        img.referrerPolicy = 'no-referrer';
        img.addEventListener('error', () => { img.style.display = 'none'; });
        wrap.appendChild(img);
        const link = document.createElement('a');
        link.href = safe; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = url;
        wrap.appendChild(link);
      }
      el.appendChild(wrap);
    }
  }

  // --- 消息渲染 ---
  function addUserMsg(text, ts) {
    chatArea.insertAdjacentHTML('beforeend', `
      <div class="msg user"><div>
        <div class="bubble">${escapeHtml(text)}</div>
        <div class="meta">${ts ? formatTime(ts) : nowTime()}</div>
      </div><div class="avatar">我</div></div>`);
    scrollToBottom();
  }
  function addBotMsgWithTime(text, ts, imageUrls) {
    const id = 'bot-his-' + Math.random().toString(36).slice(2);
    chatArea.insertAdjacentHTML('beforeend', `
      <div class="msg bot" id="${id}"><div class="avatar bot">掌柜智库</div><div>
        <div class="bubble"><div class="answer"></div></div>
        <div class="meta">${formatTime(ts)}</div>
      </div></div>`);
    const el = document.getElementById(id);
    if (el) renderAnswerWithImages(el.querySelector('.answer'), text || '', imageUrls || []);
    scrollToBottom();
  }
  function addBotSkeleton() {
    const id = 'bot-' + Math.random().toString(36).slice(2);
    chatArea.insertAdjacentHTML('beforeend', `
      <div class="msg bot" id="${id}"><div class="avatar bot">掌柜智库</div>
      <div style="min-width:180px"><div class="bubble">
        <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
        <details class="progress" open><summary>阶段进度（等待中）</summary><ul></ul></details>
      </div><div class="meta">${nowTime()}</div></div></div>`);
    scrollToBottom();
    return document.getElementById(id);
  }
  function renderProgress(el, doneList, runningList, status) {
    const details = el.querySelector('details.progress');
    if (!details) return;
    const summary = details.querySelector('summary');
    const ul = details.querySelector('ul');
    const done = Array.isArray(doneList) ? doneList : [];
    const running = Array.isArray(runningList) ? runningList : [];
    const sm = { processing: '处理中', completed: '已完成', failed: '失败', pending: '等待中' };
    summary.textContent = `阶段进度（已完成${done.length}，进行中${running.length}，状态：${sm[status] || status || '-'}）`;
    ul.innerHTML = '';
    const lines = [...done.map(x => `✅ ${x}`), ...running.map(x => `⏳ ${x}`)];
    if (!lines.length) { ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>'); return; }
    for (const l of lines) ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(l)}</li>`);
  }
  function finalizeBot(el, answer, error, imageUrls) {
    const bubble = el.querySelector('.bubble');
    const progress = el.querySelector('details.progress');
    if (progress) { progress.remove(); progress.removeAttribute('open'); }
    bubble.textContent = '';
    const answerEl = document.createElement('div');
    answerEl.className = 'answer';
    bubble.appendChild(answerEl);
    if ((error || '').trim()) {
      answerEl.textContent = `抱歉，本次处理失败：\n${error}`;
    } else {
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
    }
    if (progress) bubble.appendChild(progress);
  }

  // --- 健康检查 ---
  async function apiHealth() {
    try {
      const r = await fetch(`${QUERY_API}/health`);
      apiPill.textContent = r.ok ? 'API: 已连接' : 'API: 未连接';
    } catch(e) { apiPill.textContent = 'API: 未连接'; }
  }

  // --- 加载历史 ---
  async function loadHistory() {
    try {
      const r = await fetch(`${QUERY_API}/history/${sessionId}`);
      if (!r.ok) return;
      const data = await r.json();
      const items = Array.isArray(data.items) ? data.items : [];
      if (!items.length) return;
      const nodes = Array.from(chatArea.querySelectorAll('.msg'));
      for (let i = 1; i < nodes.length; i++) nodes[i].remove();
      for (const it of items) {
        if (it.role === 'user') addUserMsg(it.text || '', it.ts);
        else addBotMsgWithTime(it.text || '', it.ts, it.image_urls || []);
      }
      scrollToBottom();
    } catch(e) {}
  }

  // --- 提交查询 ---
  async function submitQuery(text) {
    const userId = localStorage.getItem('user_id') || '';
    const r = await fetch(`${QUERY_API}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: text, session_id: sessionId, is_stream: streamToggle.checked, user_id: userId })
    });
    if (!r.ok) throw new Error(await r.text() || '请求失败');
    return r.json();
  }

  // --- 发送消息 ---
  async function onSend() {
    const text = (chatInput.value || '').trim();
    if (!text) return;
    chatInput.value = '';
    addUserMsg(text);
    const botEl = addBotSkeleton();
    sendBtn.disabled = true;
    try {
      const data = await submitQuery(text);
      renderProgress(botEl, [], [], 'pending');
      if (!streamToggle.checked) {
        renderProgress(botEl, data.done_list || [], [], 'completed');
        // 检查是否有中断数据（需用户选择主体）
        if (data.interrupt && data.interrupt.options && data.interrupt.options.length > 0) {
          const typing = botEl.querySelector('.typing');
          if(typing) typing.remove();
          const bubble = botEl.querySelector('.bubble');
          let answerEl = bubble.querySelector('.answer');
          if(!answerEl){ answerEl = document.createElement('div'); answerEl.className = 'answer'; bubble.insertBefore(answerEl, bubble.firstChild); }
          renderInterruptOptions(botEl, answerEl, data.interrupt);
          sendBtn.disabled = false;
          return;
        }
        finalizeBot(botEl, data.answer, data.error, data.image_urls || []);
        sendBtn.disabled = false;
        return;
      }
      startSSE(data.session_id, botEl);
    } catch(e) {
      const bubble = botEl.querySelector('.bubble');
      const typing = botEl.querySelector('.typing');
      if (typing) typing.remove();
      bubble.textContent = `请求失败：${escapeHtml(e.message || e)}`;
      sendBtn.disabled = false;
    }
  }

  // ==================== 中断选项渲染（流式/非流式共用） ====================
  function renderInterruptOptions(botEl, answerEl, interruptData) {
    const options = interruptData.options || [];
    const description = interruptData.description || '';
    answerEl.textContent = '';
    const wrapper = document.createElement('div');
    wrapper.className = 'interrupt-options';
    wrapper.style.cssText = 'margin-top:10px;';
    if (description) {
      const descEl = document.createElement('div');
      descEl.style.cssText = 'font-size:13px;color:var(--muted);margin-bottom:8px;';
      descEl.textContent = description;
      wrapper.appendChild(descEl);
    }
    const btnWrap = document.createElement('div');
    btnWrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.textContent = opt;
      btn.style.cssText = 'padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);cursor:pointer;font-size:13px;color:var(--text);transition:all .15s;';
      btn.onmouseenter = () => { btn.style.borderColor = 'var(--brand)'; btn.style.color = 'var(--brand)'; };
      btn.onmouseleave = () => { btn.style.borderColor = 'var(--border)'; btn.style.color = 'var(--text)'; };
      btn.onclick = () => onOptionClick(opt, botEl, answerEl, null);
      btnWrap.appendChild(btn);
    });
    wrapper.appendChild(btnWrap);
    answerEl.appendChild(wrapper);
  }

  // --- SSE 流式 ---
  function startSSE(sid, botEl) {
    const bubble = botEl.querySelector('.bubble');
    let answerEl = bubble.querySelector('.answer');
    if (!answerEl) { answerEl = document.createElement('div'); answerEl.className = 'answer'; bubble.insertBefore(answerEl, bubble.firstChild); }
    const es = new EventSource(`${QUERY_API}/stream/${sid}`);
    let raw = '';

    es.addEventListener('progress', e => {
      try { const d = JSON.parse(e.data||'{}'); renderProgress(botEl, d.done_list, d.running_list, d.status);
        if (d.status === 'completed') { const t = botEl.querySelector('.typing'); if(t) t.remove(); sendBtn.disabled = false; }
      } catch(_){}
    });
    es.addEventListener('search_mode', e => {
      try { const d = JSON.parse(e.data||'{}');
        const pe = botEl.querySelector('details.progress');
        if(pe){ const h=document.createElement('div'); h.style.cssText='font-size:12px;color:var(--brand);margin-bottom:6px;'; h.textContent='🌐 '+(d.message||'正在通过网络搜索...'); pe.parentNode.insertBefore(h,pe); }
      } catch(_){}
    });
    es.addEventListener('delta', e => {
      try { const d = JSON.parse(e.data||'{}'); if(d.delta){ raw+=d.delta; renderAnswerWithImages(answerEl,raw,[]); scrollToBottom(); } } catch(_){}
    });
    es.addEventListener('final', e => {
      const t = botEl.querySelector('.typing'); if(t) t.remove();
      const p = botEl.querySelector('details.progress'); if(p) p.removeAttribute('open');
      try { const d = JSON.parse(e.data||'{}'); renderAnswerWithImages(answerEl, (d.answer&&d.answer.trim())?d.answer:raw, d.image_urls||[]); } catch(_){}
      es.close(); sendBtn.disabled = false;
    });
    es.addEventListener('final_answer', e => {
      const t = botEl.querySelector('.typing'); if(t) t.remove();
      const p = botEl.querySelector('details.progress'); if(p) p.removeAttribute('open');
      try { const d = JSON.parse(e.data||'{}'); renderAnswerWithImages(answerEl, (d.answer&&d.answer.trim())?d.answer:raw, d.image_urls||[]); } catch(_){}
      es.close(); sendBtn.disabled = false;
    });
    es.addEventListener('interrupt', e => {
      const t = botEl.querySelector('.typing'); if(t) t.remove();
      const p = botEl.querySelector('details.progress'); if(p) p.removeAttribute('open');
      try {
        const d = JSON.parse(e.data||'{}');
        const interruptData = d.interrupt || {};
        renderInterruptOptions(botEl, answerEl, interruptData);
      } catch(_){}
      es.close(); sendBtn.disabled = false;
    });
    es.addEventListener('error', e => {
      const t = botEl.querySelector('.typing'); if(t) t.remove();
      const p = botEl.querySelector('details.progress'); if(p) p.removeAttribute('open');
      try { const msg = e&&e.data ? (JSON.parse(e.data).error||'SSE 连接中断') : 'SSE 连接中断'; raw += `\n\n（错误：${msg}）`; renderAnswerWithImages(answerEl,raw,[]); }
      catch(_) { raw += '\n\n（错误：SSE 连接中断）'; renderAnswerWithImages(answerEl,raw,[]); }
      es.close(); sendBtn.disabled = false;
    });
  }

  // --- 中断恢复 ---
  async function onOptionClick(item, botEl, answerEl, es) {
    answerEl.textContent = `已选择：${item}`;
    answerEl.style.cssText = 'color:var(--brand);font-weight:500;';
    const newBotEl = addBotSkeleton();
    sendBtn.disabled = true;
    try {
      const r = await fetch(`${QUERY_API}/resume`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, selected_value: item, is_stream: streamToggle.checked })
      });
      if (!r.ok) throw new Error(await r.text() || '恢复失败');
      const data = await r.json();
      if (!streamToggle.checked) {
        const t = newBotEl.querySelector('.typing'); if(t) t.remove();
        finalizeBot(newBotEl, data.answer, null, data.image_urls || []);
        sendBtn.disabled = false;
        return;
      }
      startSSE(sessionId, newBotEl);
    } catch(e) {
      const b = newBotEl.querySelector('.bubble'); const t = newBotEl.querySelector('.typing'); if(t) t.remove();
      b.textContent = `恢复失败：${escapeHtml(e.message||e)}`;
      sendBtn.disabled = false;
    }
  }

  // --- 事件绑定 ---
  sendBtn.addEventListener('click', onSend);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); } });
  btnClear.addEventListener('click', async () => {
    if (!confirm('确定清空当前会话的历史记录吗？')) return;
    try { await fetch(`${QUERY_API}/history/${sessionId}`, { method: 'DELETE' }); } catch(e) {}
    const nodes = Array.from(chatArea.querySelectorAll('.msg'));
    for (let i = 1; i < nodes.length; i++) nodes[i].remove();
    scrollToBottom();
  });

  apiHealth();
  setTimeout(() => { loadHistory(); }, 500);
  setTimeout(() => chatInput.focus(), 200);

  // ==================== 导入模块 ====================
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.background = 'rgba(26,167,255,.06)'; });
  dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.style.background = ''; });
  dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.background = ''; handleFiles(e.dataTransfer.files); });
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  function handleFiles(files) { Array.from(files).forEach(uploadFile); }

  function updateProgressBar(bar, pct) {
    bar.style.width = pct + '%';
    bar.style.backgroundColor = pct >= 100 ? 'var(--success)' : (pct > 30 ? 'var(--brand)' : 'var(--warning)');
  }

  function normalizeDoneLog(t) { return typeof t === 'string' ? (t.endsWith('已完成') ? t : `${t}已完成`) : String(t); }
  function normalizeRunningLog(t) {
    if (typeof t !== 'string') return String(t);
    if (t.startsWith('正在进行')) return t.endsWith('...') ? t : `${t}...`;
    return `正在进行${t}...`;
  }
  function renderLogs(el, doneList, runningList) {
    const summary = el.querySelector('.log-details summary');
    const ul = el.querySelector('.log-list');
    const done = Array.isArray(doneList) ? doneList : [];
    const running = Array.isArray(runningList) ? runningList : [];
    summary.textContent = `日志（已完成${done.length}，进行中${running.length}，点击展开）`;
    ul.innerHTML = '';
    const lines = [...done.map(normalizeDoneLog), ...running.map(normalizeRunningLog)];
    if (!lines.length) { const li = document.createElement('li'); li.textContent = '暂无日志'; ul.appendChild(li); }
    else { for (const l of lines) { const li = document.createElement('li'); li.textContent = l; ul.appendChild(li); } }
  }

  async function uploadFile(file) {
    if (!ensureAuth()) return;
    const id = 'file-' + Math.random().toString(36).substr(2, 9);
    fileList.insertAdjacentHTML('afterbegin', `
      <div class="file-item" id="${id}">
        <div class="file-info">
          <span class="file-name">${escapeHtml(file.name)}</span>
          <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
          <div class="progress-bar-container"><div class="progress-bar"></div></div>
          <details class="log-details"><summary>日志（点击展开）</summary><ul class="log-list"></ul></details>
        </div>
        <div class="status-badge status-uploading">上传中...</div>
      </div>`);
    const el = document.getElementById(id);
    const badge = el.querySelector('.status-badge');
    const bar = el.querySelector('.progress-bar');
    const barContainer = el.querySelector('.progress-bar-container');

    const fd = new FormData();
    fd.append('files', file);
    try {
      barContainer.style.display = 'block';
      updateProgressBar(bar, 20);
      const r = await fetch(`${IMPORT_API}/upload`, { method: 'POST', headers: authHeaders(), body: fd });
      if (r.status === 401) { badge.textContent = '未授权'; badge.className = 'status-badge status-error'; alert('请重新登录'); window.location.href = AUTH_BASE + '/html?redirect_to=' + encodeURIComponent(window.location.href); return; }
      if (r.status === 403) { badge.textContent = '无权限'; badge.className = 'status-badge status-error'; alert('无导入权限'); return; }
      if (!r.ok) throw new Error('上传失败');
      const data = await r.json();
      const taskId = data.task_ids[0];
      updateProgressBar(bar, 0);
      badge.textContent = '处理中...';
      badge.className = 'status-badge status-processing';
      pollStatus(taskId, el);
    } catch(e) {
      console.error(e);
      badge.textContent = '失败';
      badge.className = 'status-badge status-error';
    }
  }

  function pollStatus(taskId, el) {
    const badge = el.querySelector('.status-badge');
    const bar = el.querySelector('.progress-bar');
    const iv = setInterval(async () => {
      try {
        const r = await fetch(`${IMPORT_API}/status/${taskId}`);
        const d = await r.json();
        renderLogs(el, d.done_list, d.running_list);
        const progress = typeof d.progress === 'number' ? d.progress : 0;
        if (d.status === 'completed') {
          badge.textContent = '已完成'; badge.className = 'status-badge status-completed';
          updateProgressBar(bar, 100); clearInterval(iv);
        } else if (d.status === 'processing') {
          badge.textContent = '处理中...';
          updateProgressBar(bar, Math.max(progress, 5));
        } else if (d.status === 'failed') {
          badge.textContent = '失败'; badge.className = 'status-badge status-error'; clearInterval(iv);
        }
      } catch(e) { console.error('轮询错误', e); }
    }, 2000);
  }
</script>
</body>
</html>
