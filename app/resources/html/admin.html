<!-- 管理后台页面 — DeepSeek 风格，深色侧边栏 + 白色内容区 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>掌柜智库 — 管理后台</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --sidebar-bg: #1a1c24;
      --sidebar-hover: #252833;
      --sidebar-active: rgba(59,130,246,.15);
      --sidebar-active-border: #3b82f6;
      --card: #ffffff;
      --text: #1d2129;
      --text-2: #4e5969;
      --text-3: #86909c;
      --border: #e5e6eb;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
      --sidebar-w: 240px;
      --topbar-h: 56px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ========== 侧边栏 ========== */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      border-right: 1px solid #2a2d38;
    }
    .sidebar-brand {
      padding: 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a2d38;
    }
    .sidebar-brand .logo {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #fff; font-weight: 700;
    }
    .sidebar-brand span {
      font-size: 15px;
      font-weight: 600;
      color: #e8eaed;
    }
    .sidebar-nav {
      flex: 1;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 14px;
      color: #9aa0a8;
      cursor: pointer;
      transition: all .15s;
      border-left: 3px solid transparent;
    }
    .nav-item:hover {
      background: var(--sidebar-hover);
      color: #e8eaed;
    }
    .nav-item.active {
      background: var(--sidebar-active);
      color: var(--accent);
      border-left-color: var(--sidebar-active-border);
    }
    .nav-item .icon {
      font-size: 18px;
      width: 22px;
      text-align: center;
    }
    .sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid #2a2d38;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-footer .avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: #2a2d38;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #9aa0a8;
    }
    .sidebar-footer .user-info {
      flex: 1;
      min-width: 0;
    }
    .sidebar-footer .user-info .name {
      font-size: 13px;
      color: #e8eaed;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar-footer .user-info .role {
      font-size: 11px;
      color: #6b7280;
    }
    .btn-logout {
      border: none;
      background: transparent;
      color: #6b7280;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all .15s;
    }
    .btn-logout:hover {
      background: rgba(239,68,68,.15);
      color: var(--error);
    }

    /* ========== 主内容区 ========== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: var(--topbar-h);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
    }
    .topbar h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .topbar .breadcrumb {
      font-size: 12px;
      color: var(--text-3);
    }
    .topbar .spacer { flex: 1; }
    .topbar .btn-back {
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text-2);
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: all .15s;
    }
    .topbar .btn-back:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* ========== 页面容器 ========== */
    .page { display: none; }
    .page.active { display: block; }

    /* ========== 卡片 ========== */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ========== 工具栏 ========== */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .toolbar input, .toolbar select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text);
      background: var(--card);
      outline: none;
    }
    .toolbar input:focus, .toolbar select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,.1);
    }
    .toolbar input {
      width: 220px;
    }

    /* ========== 表格 ========== */
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #f7f8fa;
      color: var(--text-3);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    tr:hover td { background: #fafbfc; }

    /* ========== 角色徽章 ========== */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-admin { background: rgba(239,68,68,.1); color: var(--error); }
    .badge-whitelist { background: rgba(34,197,94,.1); color: var(--success); }
    .badge-user { background: rgba(59,130,246,.1); color: var(--accent); }

    /* ========== 操作按钮 ========== */
    .btn-sm {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      background: var(--card);
      color: var(--text-2);
      transition: all .15s;
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm.danger { color: var(--error); border-color: rgba(239,68,68,.3); }
    .btn-sm.danger:hover { background: rgba(239,68,68,.08); }

    /* ========== 统计卡片 ========== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
    }
    .stat-card .num {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-card .label {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 4px;
    }

    /* ========== 系统设置 ========== */
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .setting-item:last-child { border-bottom: none; }
    .setting-item .label { font-size: 14px; color: var(--text); }
    .setting-item .value { font-size: 13px; color: var(--text-3); }

    /* ========== 分页 ========== */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }
    .pagination button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      color: var(--text-2);
      font-size: 13px;
      cursor: pointer;
    }
    .pagination button:hover { border-color: var(--accent); color: var(--accent); }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }
    .pagination .page-info { font-size: 13px; color: var(--text-3); }

    /* ========== Toast ========== */
    .toast-container {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
      animation: toastIn .3s ease-out;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--error); }
    .toast.info { background: var(--accent); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== 弹窗 ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      display: none;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .modal h3 { font-size: 16px; margin-bottom: 12px; }
    .modal p { font-size: 14px; color: var(--text-2); margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-actions button {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-2);
    }
    .modal-actions .btn-confirm {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar">
  <div class="sidebar-brand">
    <div class="logo">智</div>
    <span>掌柜智库</span>
  </div>
  <div class="sidebar-nav">
    <div class="nav-item active" data-page="users" onclick="switchPage('users')">
      <span class="icon">&#128101;</span>
      <span>用户管理</span>
    </div>
    <div class="nav-item" data-page="settings" onclick="switchPage('settings')">
      <span class="icon">&#9881;</span>
      <span>系统设置</span>
    </div>
  </div>
  <div class="sidebar-footer">
    <div class="avatar" id="adminAvatar">A</div>
    <div class="user-info">
      <div class="name" id="adminName">管理员</div>
      <div class="role" id="adminRole">admin</div>
    </div>
    <button class="btn-logout" onclick="logout()" title="退出登录">&#8592;</button>
  </div>
</div>

<!-- 主内容 -->
<div class="main">
  <div class="topbar">
    <h2 id="pageTitle">用户管理</h2>
    <span class="breadcrumb" id="breadcrumb">首页 / 用户管理</span>
    <div class="spacer"></div>
    <a class="btn-back" href="http://127.0.0.1:8001/html">&#8592; 返回问答</a>
  </div>

  <div class="content">
    <!-- ========== 用户管理页 ========== -->
    <div class="page active" id="page-users">
      <div class="stats-row">
        <div class="stat-card">
          <div class="num" id="statTotal">-</div>
          <div class="label">总用户数</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statAdmin">-</div>
          <div class="label">管理员</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statWhitelist">-</div>
          <div class="label">白名单用户</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statUser">-</div>
          <div class="label">普通用户</div>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <input type="text" id="searchInput" placeholder="搜索用户名..." oninput="renderUsers()" />
          <select id="roleFilter" onchange="renderUsers()">
            <option value="">全部角色</option>
            <option value="admin">管理员</option>
            <option value="whitelist">白名单</option>
            <option value="user">普通用户</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>用户名</th>
                <th>角色</th>
                <th>邮箱</th>
                <th>注册时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>

        <div class="pagination">
          <button id="prevPage" onclick="changePage(-1)">&#8249; 上一页</button>
          <span class="page-info" id="pageInfo">1 / 1</span>
          <button id="nextPage" onclick="changePage(1)">下一页 &#8250;</button>
        </div>
      </div>
    </div>

    <!-- ========== 系统设置页 ========== -->
    <div class="page" id="page-settings">
      <div class="card">
        <div class="card-title">&#9881; 服务信息</div>
        <div class="setting-item">
          <span class="label">认证服务</span>
          <span class="value">127.0.0.1:8002</span>
        </div>
        <div class="setting-item">
          <span class="label">查询服务</span>
          <span class="value">127.0.0.1:8001</span>
        </div>
        <div class="setting-item">
          <span class="label">导入服务</span>
          <span class="value">127.0.0.1:8000</span>
        </div>
        <div class="setting-item">
          <span class="label">数据库</span>
          <span class="value">MongoDB</span>
        </div>
        <div class="setting-item">
          <span class="label">向量库</span>
          <span class="value">Milvus</span>
        </div>
        <div class="setting-item">
          <span class="label">版本</span>
          <span class="value">v0.2.0</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">确认操作</h3>
    <p id="modalMessage">确定要执行此操作吗？</p>
    <div class="modal-actions">
      <button onclick="closeModal()">取消</button>
      <button class="btn-confirm" id="modalConfirm" onclick="confirmModal()">确定</button>
    </div>
  </div>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>

<script>
  // ==================== 配置 ====================
  const AUTH_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8002';

  // ==================== 状态 ====================
  let allUsers = [];
  let currentPage = 1;
  const pageSize = 20;
  let modalCallback = null;

  // ==================== 初始化 ====================
  (function init() {
    // 检查 Token
    const token = localStorage.getItem('access_token');
    if (!token) {
      window.location.href = AUTH_BASE + '/html';
      return;
    }
    // 显示管理员信息
    document.getElementById('adminName').textContent = localStorage.getItem('username') || '管理员';
    document.getElementById('adminRole').textContent = localStorage.getItem('user_role') || 'admin';
    // 加载用户列表
    loadUsers();
  })();

  // ==================== 页面切换 ====================
  function switchPage(page) {
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.page === page);
    });
    document.querySelectorAll('.page').forEach(el => {
      el.classList.toggle('active', el.id === 'page-' + page);
    });
    const titles = { users: '用户管理', settings: '系统设置' };
    document.getElementById('pageTitle').textContent = titles[page] || page;
    document.getElementById('breadcrumb').textContent = '首页 / ' + (titles[page] || page);
  }

  // ==================== Toast 提示 ====================
  function showToast(message, type) {
    type = type || 'info';
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(() => { el.remove(); }, 3000);
  }

  // ==================== 弹窗 ====================
  function showModal(title, message, callback) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    modalCallback = callback;
    document.getElementById('modalOverlay').classList.add('show');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    modalCallback = null;
  }
  function confirmModal() {
    if (modalCallback) modalCallback();
    closeModal();
  }

  // ==================== Token 请求头 ====================
  function authHeaders() {
    return { 'Authorization': 'Bearer ' + localStorage.getItem('access_token') };
  }

  // ==================== 加载用户列表 ====================
  async function loadUsers() {
    try {
      const res = await fetch(AUTH_BASE + '/admin/users?page=1&page_size=200', {
        headers: authHeaders(),
      });
      if (res.status === 401) {
        showToast('登录已过期，请重新登录', 'error');
        setTimeout(() => { window.location.href = AUTH_BASE + '/html'; }, 1500);
        return;
      }
      if (res.status === 403) {
        showToast('无管理员权限', 'error');
        return;
      }
      const data = await res.json();
      allUsers = (data.data && data.data.items) || [];
      updateStats();
      renderUsers();
    } catch (e) {
      showToast('加载用户列表失败', 'error');
    }
  }

  // ==================== 统计 ====================
  function updateStats() {
    document.getElementById('statTotal').textContent = allUsers.length;
    document.getElementById('statAdmin').textContent = allUsers.filter(u => u.role === 'admin').length;
    document.getElementById('statWhitelist').textContent = allUsers.filter(u => u.role === 'whitelist').length;
    document.getElementById('statUser').textContent = allUsers.filter(u => u.role === 'user').length;
  }

  // ==================== 渲染用户表格 ====================
  function renderUsers() {
    const search = (document.getElementById('searchInput').value || '').toLowerCase();
    const roleFilter = document.getElementById('roleFilter').value;

    let filtered = allUsers;
    if (search) {
      filtered = filtered.filter(u => (u.username || '').toLowerCase().includes(search));
    }
    if (roleFilter) {
      filtered = filtered.filter(u => u.role === roleFilter);
    }

    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * pageSize;
    const pageItems = filtered.slice(start, start + pageSize);

    const tbody = document.getElementById('userTableBody');
    tbody.innerHTML = '';

    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-3);padding:40px 0">暂无数据</td></tr>';
    } else {
      pageItems.forEach((u, i) => {
        const badgeClass = u.role === 'admin' ? 'badge-admin' : u.role === 'whitelist' ? 'badge-whitelist' : 'badge-user';
        const roleLabel = u.role === 'admin' ? '管理员' : u.role === 'whitelist' ? '白名单' : '普通用户';
        const created = u.created_at ? new Date(u.created_at).toLocaleString('zh-CN') : '-';

        let actions = '';
        if (u.role === 'user') {
          actions = `<button class="btn-sm" onclick="addWhitelist('${u.id}','${escHtml(u.username)}')">添加白名单</button>`;
        } else if (u.role === 'whitelist') {
          actions = `<button class="btn-sm danger" onclick="removeWhitelist('${u.id}','${escHtml(u.username)}')">移除白名单</button>`;
        } else {
          actions = '<span style="color:var(--text-3);font-size:12px">-</span>';
        }

        tbody.innerHTML += `
          <tr>
            <td>${start + i + 1}</td>
            <td>${escHtml(u.username || '-')}</td>
            <td><span class="badge ${badgeClass}">${roleLabel}</span></td>
            <td>${escHtml(u.email || '-')}</td>
            <td>${created}</td>
            <td>${actions}</td>
          </tr>`;
      });
    }

    // 分页
    document.getElementById('pageInfo').textContent = currentPage + ' / ' + totalPages;
    document.getElementById('prevPage').disabled = currentPage <= 1;
    document.getElementById('nextPage').disabled = currentPage >= totalPages;
  }

  function changePage(delta) {
    currentPage += delta;
    if (currentPage < 1) currentPage = 1;
    renderUsers();
  }

  // ==================== 白名单操作 ====================
  function addWhitelist(userId, username) {
    showModal('添加白名单', '确定将用户 "' + username + '" 添加到白名单吗？', async () => {
      try {
        const res = await fetch(AUTH_BASE + '/admin/whitelist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ user_id: userId }),
        });
        const data = await res.json();
        if (data.code === 200) {
          showToast('已添加到白名单', 'success');
          loadUsers();
        } else {
          showToast(data.message || '操作失败', 'error');
        }
      } catch (e) {
        showToast('网络错误', 'error');
      }
    });
  }

  function removeWhitelist(userId, username) {
    showModal('移除白名单', '确定将用户 "' + username + '" 从白名单移除吗？', async () => {
      try {
        const res = await fetch(AUTH_BASE + '/admin/whitelist/' + userId, {
          method: 'DELETE',
          headers: authHeaders(),
        });
        const data = await res.json();
        if (data.code === 200) {
          showToast('已从白名单移除', 'success');
          loadUsers();
        } else {
          showToast(data.message || '操作失败', 'error');
        }
      } catch (e) {
        showToast('网络错误', 'error');
      }
    });
  }

  // ==================== 退出登录 ====================
  function logout() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('token_expires');
    localStorage.removeItem('username');
    localStorage.removeItem('user_id');
    localStorage.removeItem('user_role');
    window.location.href = AUTH_BASE + '/html';
  }

  // ==================== 工具函数 ====================
  function escHtml(str) {
    return String(str || '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }
</script>
</body>
